<div class="tl-dialog">
	<div class="tl-dialog-body">
		<div class="tl-dialog-text">{{batchText}}</div>
		<div class="tl-grid">
			<label>{{localize "TOKEN_LOOT.Dialog.Chance"}}</label>
			<input class="tl-batch-chance" type="number" min="0" max="100" value="10" />
			<label>{{localize "TOKEN_LOOT.Dialog.QuantityMin"}}</label>
			<input class="tl-batch-qmin" type="number" min="1" value="1" />
			<label>{{localize "TOKEN_LOOT.Dialog.QuantityMax"}}</label>
			<input class="tl-batch-qmax" type="number" min="1" value="1" />
		</div>
		<label style="margin-top:8px;display:inline-flex;gap:6px;align-items:center;">
			<input type="checkbox" class="tl-include-subfolders" {{includeSubfoldersChecked}} /> {{localize "TOKEN_LOOT.Dialog.IncludeSubfolders"}}
		</label>
	</div>
	<div class="tl-dialog-actions">
		<button class="tl-btn tl-primary tl-apply">{{localize "TOKEN_LOOT.Dialog.Add"}}</button>
		<button class="tl-btn tl-cancel">{{localize "TOKEN_LOOT.Dialog.Cancel"}}</button>
	</div>
</div>
