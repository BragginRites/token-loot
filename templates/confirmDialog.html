<div class="tl-confirm-overlay">
	<div class="tl-confirm-dialog">
		<div class="tl-confirm-header">{{title}}</div>
		<div class="tl-confirm-body">{{message}}</div>
		<div class="tl-confirm-actions">
			<button class="tl-confirm-btn tl-confirm-cancel">{{localize "TOKEN_LOOT.Dialog.Cancel"}}</button>
			<button class="tl-confirm-btn tl-confirm-ok tl-danger">{{localize "TOKEN_LOOT.Dialog.Delete"}}</button>
		</div>
	</div>
</div>
