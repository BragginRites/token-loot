<div class="tl-card" data-gid="{{group.id}}">
	<div class="tl-card-hdr">
		<input class="tl-title" data-gid="{{group.id}}" value="{{group.name}}" placeholder="{{localize 'TOKEN_LOOT.Card.GroupTitlePlaceholder'}}" />
		<div class="tl-card-actions">
			<button class="tl-btn tl-duplicate" title="{{localize 'TOKEN_LOOT.Card.DuplicateGroup'}}"><i class="fas fa-copy"></i></button>
			<button class="tl-btn tl-danger tl-delete" title="{{localize 'TOKEN_LOOT.Card.DeleteGroup'}}"><i class="fas fa-trash"></i></button>
		</div>
	</div>
	<div class="tl-card-body">
		<div class="tl-section" data-section="actors">
			<div class="tl-section-header">
				<div class="tl-collapse-arrow"><i class="fas fa-chevron-down"></i></div>
				<div class="tl-section-title">{{localize "TOKEN_LOOT.Card.Actors"}}</div>
				<div class="tl-section-actions">
					<button class="tl-btn tl-btn-sm tl-danger tl-clear-actors" title="{{localize 'TOKEN_LOOT.Card.ClearAllActorsTitle'}}">{{localize "TOKEN_LOOT.Card.ClearAll"}}</button>
				</div>
			</div>
			<div class="tl-section-content">
				<div class="tl-drop tl-actors" data-gid="{{group.id}}">
					<!-- actor chips injected here -->
				</div>
			</div>
		</div>
		
		<div class="tl-section" data-section="currency">
			<div class="tl-section-header">
				<div class="tl-collapse-arrow"><i class="fas fa-chevron-down"></i></div>
				<div class="tl-section-title">{{localize "TOKEN_LOOT.Card.Currency"}}</div>
				<div class="tl-section-actions">
					<span class="tl-currency-hint">{{localize "TOKEN_LOOT.Card.CurrencyExamples"}}</span>
				</div>
			</div>
			<div class="tl-section-content">
				<div class="tl-currency">
					<div class="tl-currency-compact">
                        {{#each currencies}}
						<div class="tl-currency-field">
							<label>{{this.label}}</label>
							<input class="tl-currency-input" data-key="{{this.key}}" type="text" value="{{this.value}}" />
						</div>
                        {{/each}}
					</div>
				</div>
			</div>
		</div>
		
		<div class="tl-section" data-section="blocks">
			<div class="tl-section-header">
				<div class="tl-collapse-arrow"><i class="fas fa-chevron-down"></i></div>
				<div class="tl-section-title">{{localize "TOKEN_LOOT.Card.DistributionBlocks"}}</div>
				<div class="tl-section-actions">
					<button class="tl-btn tl-btn-sm tl-add-block">{{localize "TOKEN_LOOT.Card.AddBlock"}}</button>
				</div>
			</div>
			<div class="tl-section-content">
				<div class="tl-distribution-blocks" data-gid="{{group.id}}">
					<!-- blocks injected here -->
				</div>
			</div>
		</div>
	</div>
</div>
